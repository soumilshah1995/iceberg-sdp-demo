# Loaded before the Spark session starts. Point SPARK_CONF_DIR at this folder.
# Iceberg 1.12 publishes a Spark 4.1 runtime. This lab uses PySpark 4.1.1 to match it.
spark.jars.packages org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.12.0
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.dev org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.dev.type hadoop
spark.sql.catalog.dev.warehouse file:///Users/sshah/IdeaProjects/Learn/spark-dp-examples/lab1/warehouse
spark.sql.defaultCatalog dev
